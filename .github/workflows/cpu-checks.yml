name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m warp_trap validate --device cpu --out runs/ci
      - run: python -m warp_trap benchmark --device cpu --sizes 1024 --steps 10 --repeats 2 --out runs/ci
